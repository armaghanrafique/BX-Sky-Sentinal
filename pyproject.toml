[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skysentinel"
version = "0.1.0"
description = "Multi-model drone / UAV detection for video files and live RTSP/RTMP cameras."
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["skysentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
